# cp .env.example .env, set ANTHROPIC_API_KEY, then: docker compose up --build
name: ai-cv-builder

services:
  db:
    image: postgres:17-alpine
    # Only what Postgres needs, so the API key stays out of this container.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  api:
    build: .
    init: true
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:4000:4000'
    # Worker gets 25 s to hand running jobs back before SIGKILL.
    stop_grace_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ${WEB_CONTEXT:?set WEB_CONTEXT in .env}
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:?set API_INTERNAL_URL in .env}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  db-data:
